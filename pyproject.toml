[project]
name = "npa-monitor"
version = "0.1.0"
description = "Мониторинг изменений в НПА (меры поддержки)"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pyyaml>=6.0",
    "httpx>=0.27,<1.0",
    "tenacity>=8.2",
    "charset-normalizer>=3.0",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "aiogram>=3.4,<4.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["db", "parser", "parser.sources", "bot"]
py-modules = ["config"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Фикстуры — реальная HTML-вёрстка источников, снятая вживую; переносить строки внутри
# верстки/URL ради лимита длины не нужно.
"tests/test_sources_*.py" = ["E501"]
