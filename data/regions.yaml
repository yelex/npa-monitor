# Справочник регионов и их источников, AGENTS.md раздел 4.
#
# MVP-периметр: только Москва + РФ (федеральный уровень) — см. AGENTS.md раздел 1.
# Формат рассчитан на все 89 субъектов РФ: добавление нового региона — новая запись в
# этом файле, без изменения кода парсера. code должен совпадать со значением
# db.enums.Region — там (как и с SignalCategory) в MVP всё ещё фиксированный
# Python-enum, расширение набора регионов за пределы Москвы потребует и там правки —
# осознанное ограничение MVP, см. AGENTS.md раздел 16.
#
# Отправная точка для сбора источников остальных регионов (после пилота):
# http://pravo.gov.ru/links/region/ (AGENTS.md раздел 4).
#
# access у источников — см. пояснение в data/sources.yaml.

- code: rf
  name: РФ
  # Федеральный уровень — источники в data/sources.yaml (federal), не дублируются здесь.
  sources: []

- code: moscow
  name: Москва
  sources:
    - domain: mos.ru
      url: https://www.mos.ru/authority/documents/
      access: direct
      note: >-
        официальный портал правительства региона (реестр НПА); отдельного портала
        правовой информации для Москвы не найдено — рабочая гипотеза: это он и есть
        (docs/STAGE0.md)
    - domain: msupport.dszn.ru
      access: direct
      note: >-
        разъяснительный портал минтруда/соцзащиты Москвы для участников СВО —
        не листинг НПА, вспомогательный источник (docs/STAGE0.md)
    - domain: dszn.ru
      access: unsupported
      note: >-
        требует уточнения: контент рендерится через JS, TLS-сертификат слит с mos.ru
        (docs/STAGE0.md) — нужен Playwright/аналог или внутренний API
