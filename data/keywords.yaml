# Ключевые слова классификации, AGENTS.md раздел 5 (5.2-5.3) и раздел 7 (приоритизация).
# ЖС-ключевые слова (раздел 5.1) — в data/life_situations.yaml, не здесь.

# Раздел 5.2 — тематический блок мер поддержки. Условие релевантности (раздел 4.4):
# публикация релевантна, если содержит ключевые слова ЖС И слово из этого списка.
topic_block:
  - мера поддержки
  - выплата
  - льгота
  - пособие
  - компенсация
  - субсидия

# Раздел 5.3 — маркеры документа. Подтверждают привязку к НПА (раздел 4.2); используются
# также как сигнал «есть ссылка на документ» в приоритизации (раздел 7).
document_markers:
  - постановление
  - указ
  - закон
  - приказ
  - распоряжение

# Раздел 7 «Приоритизация», слова высокого приоритета.
priority_high_words:
  - новый
  - изменение
  - отмена
  - утратил силу
  - индексация
  - повышение

# Маркеры типа события -> db.enums.EventType. Прямого списка «ключевое слово -> тип
# события» в исходном ТЗ нет (раздел 5.4 «маркеры сути» — один общий список без разбивки
# по типам, раздел 4.3 описывает типы событий без ключевых слов) — разбивка ниже
# составлена реализатором на основе обоих разделов, включая слова отмены/утраты силы
# (упомянуты в разделе 4.3, отсутствуют в разделе 5.4). Уточнить на реальных примерах
# по итогам пилота (AGENTS.md раздел 16).
event_type_markers:
  repeal:
    - отмена
    - отменён
    - отменен
    - утратил силу
    - утратила силу
  entry_into_force:
    - вступил в силу
    - вступает в силу
    - вступила в силу
  amendment:
    - внесены изменения
    - внесение изменений
    - изменение
  new_document:
    - принят
    - принята
    - утверждён
    - утвержден
    - утверждена
    - подписан
    - подписана
