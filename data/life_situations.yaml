# Справочник жизненных ситуаций (ЖС), AGENTS.md раздел 1 и раздел 5.1.
#
# Добавление новой ЖС — правка этого файла (id, name, keywords), без изменения кода
# парсера/классификатора (AGENTS.md раздел 1). id должен совпадать со значением
# db.enums.SignalCategory — в MVP набор категорий там всё ещё фиксированный Python-enum
# (см. db/catalog.py и AGENTS.md раздел 16, пункт про расширяемость), так что для новой
# ЖС в текущем MVP потребуется также добавить значение в SignalCategory; это осознанное
# ограничение MVP, а не то, что должно остаться так навсегда.

- id: veterans
  name: Ветераны боевых действий
  keywords:
    - ветеран боевых действий
    - ВБД
    - ветеран СВО

- id: disabled
  name: Люди с инвалидностью
  keywords:
    - инвалид
    - ребёнок-инвалид
    - лицо с ограниченными возможностями
    - инвалид с детства
    - инвалид по зрению

- id: svo
  name: Участники СВО и члены их семей
  keywords:
    - участник СВО
    - мобилизованный
    - контрактник
    - доброволец
    - члены семей участников СВО
    - дети участников СВО
