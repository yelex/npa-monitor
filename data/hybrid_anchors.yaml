# Якорные фразы Stage B (гибридный fallback-классификатор ЖС),
# docs/SPEC_hybrid_classifier.md, п.4 плана /tmp/claude_hybrid_classifier_plan.md.
#
# Используются parser/hybrid_classifier.py: cos-близость (rubert-tiny2 ONNX) и BM25
# (rank_bm25, токенизация parser/ru_stem) якоря против ключевых слов life_situations.yaml
# — реальные канцелярские обороты НПА, которые Stage A (точная словоформа +
# смежность слов, raздел 5.1) не покрывает. Расширяется без изменения кода — как и
# `data/life_situations.yaml`, id должен совпадать с db.enums.SignalCategory.

- id: veterans
  anchors:
    - ветеран боевых действий
    - ветеран специальной военной операции
    - лица, принимавшие участие в боевых действиях
    - в связи с прохождением военной службы в зоне боевых действий
    - граждане, удостоенные звания ветерана боевых действий
    - участники боевых действий и приравненные к ним лица
    - меры социальной поддержки ветеранов боевых действий

- id: disabled
  anchors:
    - инвалид
    - ребёнок-инвалид
    - лицо с ограниченными возможностями здоровья
    - граждане, признанные инвалидами
    - дети-инвалиды и лица, их сопровождающие
    - лица с стойкими нарушениями здоровья
    - инвалиды и лица с инвалидностью

- id: svo
  anchors:
    - участник специальной военной операции
    - в связи с проведением специальной военной операции
    - военнослужащие, принимающие участие в специальной военной операции
    - мобилизованные граждане
    - члены семей военнослужащих, погибших при исполнении обязанностей военной службы в ходе специальной военной операции
    - граждане, заключившие контракт о добровольном содействии в выполнении задач специальной военной операции
    - дети погибших (умерших) участников специальной военной операции
    - лица, проходящие военную службу по контракту, заключённому в связи с частичной мобилизацией
