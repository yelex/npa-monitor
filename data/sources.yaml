# Белый список источников парсера, AGENTS.md раздел 4.
#
# access:
#   direct     — прямой HTTP(S)-запрос работает (docs/STAGE0.md, раздел 2)
#   ru_proxy   — сеть RSNET режет не-РФ IP на 443/80; доступ по HTTP через RU_PROXY_URL
#                (docs/STAGE0.md, раздел 2.1); подтвердить схему на боевом VPS
#   unsupported — известен, но парсером пока не обходится (JS-рендер и т.п.)
#
# Региональные источники (Москва в MVP) — в data/regions.yaml, не здесь.

federal:
  - domain: publication.pravo.gov.ru
    url: http://publication.pravo.gov.ru/
    access: ru_proxy
    note: официальные опубликования — единственный источник опубликования федеральных актов
  - domain: kremlin.ru
    url: http://www.kremlin.ru/
    access: ru_proxy
    note: указы и поручения Президента РФ
  - domain: government.ru
    url: https://government.ru/
    access: ru_proxy
    note: постановления и распоряжения Правительства РФ
  - domain: sfr.gov.ru
    url: https://sfr.gov.ru/
    access: direct
    note: Социальный фонд России — проверено, docs/STAGE0.md
  - domain: mintrud.gov.ru
    url: https://mintrud.gov.ru/
    access: direct
    note: Минтруд России — проверено, docs/STAGE0.md

# Контекстные источники — не единственное основание для сигнала без подтверждения
# (AGENTS.md раздел 4), только новости/обзоры законодательства.
other:
  - domain: garant.ru
    url: https://rss.garant.ru/news/
    access: direct
    note: >-
      новости законодательства, RSS (rss.garant.ru — редирект с
      garant.ru/rss/news/, проверено вживую 2026-08-20); опубликованные ссылки — на
      www.garant.ru
  - domain: consultant.ru
    url: https://www.consultant.ru/rss/hotdocs.xml
    access: direct
    note: обзоры изменений, RSS — проверено вживую
  - domain: docs.cntd.ru
    url: https://docs.cntd.ru/comments
    access: ru_proxy
    note: >-
      обзоры изменений; страницы документов доступны через RU-прокси (проверено
      вживую 2026-08-25: direct — таймаут, через http://95.142.42.28:8888 — 200
      за 0.7с; боевой фетч подтверждён npa-somas, E2E sig-106). Часть страниц
      (comments, SSO) может редирект-лупить — деградация в обычное «недоступно».
  - domain: tass.ru
    url: https://tass.ru/rss/v2.xml
    access: direct
    note: >-
      государственное информагентство, RSS — требует браузероподобный User-Agent
      (пустой ответ на дефолтный UA библиотек, проверено вживую)
  - domain: ria.ru
    url: https://ria.ru/export/rss2/index.xml
    access: direct
    note: государственное информагентство, RSS — проверено вживую
  - domain: rg.ru
    url: https://rg.ru/xml/index.xml
    access: direct
    note: >-
      «Российская газета» — официальный публикатор НПА, альтернатива для конкретного
      акта; RSS — проверено вживую
