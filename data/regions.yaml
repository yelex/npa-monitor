# Справочник регионов и их источников, AGENTS.md раздел 4.
#
# Фаза 13 (docs/SPEC_region_expansion.md): покрывает все 89 регионов (rf/moscow/undefined
# — сентинелы ниже + ~87 регионов, сгенерированных из data/benefits_knowledge_base.json).
# code — не значение Python-enum (db.enums.Region удалён), просто строка: RegionEntry.code
# читается как есть, без сверки с кодом (db/catalog.py::load_regions). Добавление нового
# региона/источника — правка этого файла, без изменения кода парсера/бота.
#
# rf/moscow/undefined — сентинел-коды (db.enums.REGION_RF/REGION_MOSCOW/REGION_UNDEFINED),
# участвуют в коде отдельными ветками (федеральный уровень / не определён) — закреплены
# руками, scripts/gen_regions_yaml.py их не создаёт и не перезаписывает. Остальные записи
# ниже маркера — генерируются этим скриптом, ручные правки там будут потеряны при
# следующем запуске.
#
# access у источников — см. пояснение в data/sources.yaml.

- code: rf
  name: РФ
  # Федеральный уровень — источники в data/sources.yaml (federal), не дублируются здесь.
  sources: []

- code: moscow
  name: Москва
  sources:
    - domain: mos.ru
      url: https://www.mos.ru/authority/documents/
      access: direct
      note: >-
        официальный портал правительства региона (реестр НПА); отдельного портала
        правовой информации для Москвы не найдено — рабочая гипотеза: это он и есть
        (docs/STAGE0.md)
    - domain: msupport.dszn.ru
      access: direct
      note: >-
        разъяснительный портал минтруда/соцзащиты Москвы для участников СВО —
        не листинг НПА, вспомогательный источник (docs/STAGE0.md)
    - domain: dszn.ru
      access: unsupported
      note: >-
        требует уточнения: контент рендерится через JS, TLS-сертификат слит с mos.ru
        (docs/STAGE0.md) — нужен Playwright/аналог или внутренний API

- code: undefined
  name: Не определён
  # Регион не определён классификатором — не значение из базы мер (db/measures.py::
  # _region_name трактует этот код спецкейсом "без фильтра", а не именем для сравнения).
  sources: []

# --- Сгенерировано scripts/gen_regions_yaml.py (Фаза 13) из уникальных значений region

