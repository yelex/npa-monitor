[project]
name = "npa-monitor"
version = "0.1.0"
description = "Мониторинг изменений в НПА (меры поддержки) — Этап 1: БД и общий слой"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["db"]
